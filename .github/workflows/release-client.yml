# Builds the Windows installer and publishes it as a GitHub Release.
# Installed apps find new releases here and prompt the user to update.
#
# To release: bump "version" in client/package.json (and VERSION), commit,
# then push a matching tag:   git tag v1.2.0 && git push origin v1.2.0
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Check the tag matches the app version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match client/package.json version $v"; exit 1
          fi

      - run: npm ci

      # Create ONE draft release up front. Without this, electron-builder's parallel
      # uploads can each create their own release for the same tag, and the app's
      # updater then finds a release without latest.yml.
      - name: Create draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "PiScreen $GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload to the draft
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the files and publish the release
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in latest.yml "PiScreen-Setup-${GITHUB_REF_NAME#v}.exe"; do
            echo "$assets" | grep -qx "$f" || { echo "Missing $f"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
