<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiScreen Display</title>
<style>
  :root { --rot: 0deg; --fg: #e6e8ea; --muted: #8b949d; --accent: #f2a40c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font-family: "Archivo", system-ui, sans-serif; cursor: none; }

  #stage { position: fixed; inset: 0; overflow: hidden; scrollbar-width: none; }
  #stage::-webkit-scrollbar { display: none; }
  .media { position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh;
    transform: translate(-50%, -50%) rotate(var(--rot)); object-fit: contain; display: none;
    background: #000; }
  .rot90 .media, .rot270 .media { width: 100vh; height: 100vw; }
  .fit-cover .media { object-fit: cover; }
  /* Fit to width: page fills the width and can be scrolled from the remote */
  .fit-width #stage { overflow-y: auto; }
  .fit-width #img { position: static; transform: rotate(var(--rot)); width: 100vw; height: auto; }

  .mode-img #img, .mode-video #vid, .mode-stream #svid { display: block; }
  #svid { transform: translate(-50%, -50%); width: 100vw; height: 100vh; object-fit: contain; }
  #scanvas { transform: translate(-50%, -50%); width: 100vw; height: 100vh; object-fit: contain; }
  .mode-stream.use-canvas #scanvas { display: block; }
  .mode-stream.use-canvas #svid { visibility: hidden; }
  /* While a share is starting (or failing), cover the video with a message instead of black. */
  .mode-stream.waiting #msg { display: flex; background: #000; z-index: 5; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 2vh; text-align: center; padding: 4vw; }
  .mode-idle #idle, .mode-msg #msg { display: flex; }

  /* Welcome screen, read from across a room: the screen's name, a clock, how to connect,
     and test-card colour bars along the bottom while no picture is coming in. */
  @font-face { font-family: "Archivo"; src: url("/static/fonts/archivo.woff2") format("woff2");
    font-weight: 100 900; font-stretch: 62% 125%; }
  #idle { background: #1e2226; color: #e6e8ea; font-family: "Archivo", system-ui, sans-serif;
    display: none; flex-direction: column; justify-content: space-between; align-items: stretch;
    text-align: left; padding: 6vh 6vw 0; gap: 0; }
  .mode-idle #idle { display: flex; }
  .w-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4vw; }
  .w-name { font-size: 10vh; font-weight: 800; font-stretch: 125%; line-height: 1; letter-spacing: -0.015em;
    overflow-wrap: anywhere; }
  .w-sub { font-size: 2.6vh; color: #8b949d; margin-top: 2vh; display: flex; align-items: center; gap: 1.2vh; }
  .w-sub .lamp { width: 1.3vh; height: 1.3vh; border-radius: 50%; background: #2e9e62; box-shadow: 0 0 1.2vh rgba(46,158,98,.7); }
  .w-clock { text-align: right; flex: none; }
  #clock { font-size: 12vh; font-weight: 300; font-stretch: 70%; line-height: .9; font-variant-numeric: tabular-nums; }
  #clock small { font-size: 3.2vh; font-weight: 500; font-stretch: 100%; margin-left: 1vh; color: #8b949d; }
  #date { font-size: 2.4vh; color: #8b949d; margin-top: 1.4vh; }

  .w-connect { display: flex; align-items: center; justify-content: space-between; gap: 6vw; }
  .w-connect h2 { margin: 0 0 3vh; font-size: 3.4vh; font-weight: 600; color: #8b949d; }
  .w-steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .w-steps li { counter-increment: s; display: grid; grid-template-columns: 5vh 1fr; align-items: baseline;
    font-size: 3.6vh; line-height: 1.3; margin: 0 0 2.2vh; }
  .w-steps li::before { content: counter(s); font-weight: 700; font-stretch: 70%; color: #f2a40c; font-size: 3.6vh; }
  .w-steps b { font-weight: 700; }
  #ipUrl { color: #f2a40c; font-weight: 700; font-variant-numeric: tabular-nums; }
  #qr { width: 27vh; height: 27vh; background: #fff; border-radius: 1vh; padding: 1.4vh; flex: none; }

  .w-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 2.3vh; color: #8b949d;
    padding: 2.4vh 0; }
  #lockNote { display: flex; align-items: center; gap: 1vh; }
  #lockNote svg { width: 2.4vh; height: 2.4vh; fill: none; stroke: currentColor; stroke-width: 2; display: none; }
  #lockNote.locked { color: #e6e8ea; }
  #lockNote.locked svg { display: block; }
  .bars { display: flex; height: 1.6vh; margin: 0 -6vw; }
  .bars i { flex: 1; }
  .bars i:nth-child(1) { background: #c4c7ca; } .bars i:nth-child(2) { background: #d9c23c; }
  .bars i:nth-child(3) { background: #40b6c2; } .bars i:nth-child(4) { background: #3fa35d; }
  .bars i:nth-child(5) { background: #ad52ad; } .bars i:nth-child(6) { background: #cf463b; }
  .bars i:nth-child(7) { background: #3a55b5; }
  @media (prefers-reduced-motion: no-preference) {
    .mode-idle .bars i { animation: bar-in .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 60ms); }
    .lowpower .bars i { animation: none; }
  }
  @keyframes bar-in { from { transform: scaleY(0); transform-origin: bottom; } }

  #msg .spinner { width: 7vh; height: 7vh; border-radius: 50%; border: 0.7vh solid #333;
    border-top-color: var(--accent); animation: spin 1s linear infinite; }
  #msg.error .spinner { display: none; }
  #msgText { font-size: 3vh; color: var(--muted); max-width: 70vw; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #blank { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  .is-blank #blank { display: block; }

  #offline { position: fixed; right: 2vh; bottom: 2vh; font-size: 1.6vh; color: #ff7b7b;
    background: rgba(0,0,0,.6); padding: .6vh 1.2vh; border-radius: 1vh; display: none; z-index: 20; }
  .is-offline #offline { display: block; }
</style>
</head>
<body class="mode-idle">
  <div id="stage">
    <img id="img" class="media" alt="">
    <video id="vid" class="media" playsinline></video>
    <video id="svid" class="media" playsinline autoplay></video>
    <canvas id="scanvas" class="media"></canvas>
  </div>

  <div id="idle" class="screen">
    <div class="w-top">
      <div>
        <div class="w-name" id="screenName">PiScreen</div>
        <div class="w-sub"><span class="lamp"></span>Ready for something to show</div>
      </div>
      <div class="w-clock"><div id="clock">--:--</div><div id="date"></div></div>
    </div>

    <div class="w-connect">
      <div>
        <h2>Put something on this screen</h2>
        <ol class="w-steps">
          <li><span>Open the <b>PiScreen app</b> on your computer, or scan the code with a phone</span></li>
          <li><span>Or go to <span id="ipUrl">…</span> in any browser</span></li>
          <li><span>Pick <b id="stepName">PiScreen</b>, then share a file or your screen</span></li>
        </ol>
      </div>
      <img id="qr" alt="" src="/api/qr.svg" onerror="this.style.display='none'">
    </div>

    <div>
      <div class="w-bottom">
        <span id="lockNote"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="lockText">Anyone on this network can share here</span></span>
        <span id="hostUrl"></span>
      </div>
      <div class="bars" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></div>
    </div>
  </div>

  <div id="msg" class="screen"><div class="spinner"></div><div id="msgText"></div></div>
  <div id="blank"></div>
  <div id="offline">Reconnecting to server…</div>

<script src="/static/update-band.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), img = $('#img'), vid = $('#vid'), svid = $('#svid');
const pad = (n) => String(n).padStart(4, '0');
let S = null;
let wantedImg = null;
let serverCommit = null;
let rtc = null; // { session, pc } for an incoming screen share

const post = (url, body) => fetch(url, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function setMode(mode) {
  document.body.classList.remove('mode-idle', 'mode-msg', 'mode-img', 'mode-video', 'mode-stream');
  if (mode !== 'stream') document.body.classList.remove('waiting');
  document.body.classList.add('mode-' + mode);
  if (mode !== 'video' && vid.getAttribute('src')) {
    vid.pause(); vid.removeAttribute('src'); vid.dataset.src = ''; vid.load();
  }
}

function message(text, isError) {
  $('#msgText').textContent = text;
  $('#msg').classList.toggle('error', !!isError);
  setMode('msg');
}

function showImage(url) {
  wantedImg = url;
  if (img.dataset.src === url) { setMode('img'); return; }
  const pre = new Image();
  pre.onload = () => {
    if (wantedImg !== url) return;          // a newer page was requested meanwhile
    img.src = url; img.dataset.src = url;
    setMode('img'); stage.scrollTop = 0;
  };
  pre.onerror = () => { if (wantedImg === url) message('Could not load this file', true); };
  pre.src = url;
}

function preload(url) { const i = new Image(); i.src = url; }

function showVideo(url, v) {
  wantedImg = null;
  if (vid.dataset.src !== url) { vid.src = url; vid.dataset.src = url; }
  setMode('video');
  vid.loop = v.loop;
  vid.muted = v.muted;
  if (v.playing) {
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  } else {
    vid.pause();
  }
}

async function loadInfo() {
  try {
    const r = await fetch('/api/info'); const info = await r.json();
    $('#ipUrl').textContent = info.ip_url.replace(/\/$/, '');
    $('#hostUrl').textContent = info.host_url.replace(/\/$/, '');
  } catch (e) {}
}

// ---- Screen sharing from the desktop app (WebRTC) ----
function closeRtc() {
  if (!rtc) return;
  if (rtc.pc) rtc.pc.close();
  if (rtc.retry) clearTimeout(rtc.retry);
  clearInterval(rtc.watch);
  if (rtc.stopCanvas) rtc.stopCanvas();
  rtc = null;
  svid.srcObject = null;
  document.body.classList.remove('waiting', 'use-canvas');
}

// ?canvas=1 on the display URL forces canvas drawing (a manual workaround for black video).
const FORCE_CANVAS = new URLSearchParams(location.search).get('canvas') === '1';

function waitForIce(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { if (pc.iceGatheringState === 'complete') resolve(); };
    pc.addEventListener('icegatheringstatechange', done);
    setTimeout(resolve, 2500);
  });
}

function handleStream(stream) {
  if (!rtc || rtc.session !== stream.session) {
    closeRtc();
    rtc = { session: stream.session, source: stream.source, pc: null, shown: false };
    post('/api/signal', { type: 'ready', session: stream.session });
  }
  rtc.source = stream.source;
  setMode('stream');
  // Never show a black screen: keep a message up until a real frame is on screen.
  if (!rtc.shown) streamNote(rtc.note || `Connecting to ${stream.source}…`, rtc.noteIsError);
}

function streamNote(text, isError) {
  $('#msgText').textContent = text || '';
  $('#msg').classList.toggle('error', !!isError);
  document.body.classList.toggle('waiting', !!text);
}

function markShown(me) {
  if (me.shown || rtc !== me) return;
  me.shown = true;
  me.note = null;
  streamNote('');
}

// What the Pi is actually receiving and decoding.
async function inboundStats(pc) {
  const out = { packets: 0, decoded: 0, codec: '', decoder: '', width: 0, height: 0, state: pc.connectionState };
  let codecId = null;
  const report = await pc.getStats();
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') {
      out.packets = s.packetsReceived || 0;
      out.decoded = s.framesDecoded || 0;
      out.decoder = s.decoderImplementation || '';
      out.width = s.frameWidth || 0;
      out.height = s.frameHeight || 0;
      codecId = s.codecId;
    }
  });
  const codec = codecId && report.get(codecId);
  if (codec) out.codec = codec.mimeType.replace(/^video\//i, '');
  return out;
}

function reportDiag(me, problem, stats) {
  post('/api/signal', { type: 'diag', session: me.session, data: { problem, canvas: !!me.canvas, ...stats } });
}

// Watch the first seconds of a share and work out what's wrong if no picture appears:
//   no-media  - nothing arrives (network / firewall)
//   no-decode - video arrives but this Pi can't decode it (the app then tries another format)
//   no-render - frames decode but the video element doesn't draw them (switch to canvas drawing)
function startWatchdog(me) {
  clearInterval(me.watch);
  const pc = me.pc;
  const started = performance.now();
  me.problem = null;
  if (FORCE_CANVAS || me.canvas) {
    me.canvas = false;
    startCanvas(me);
  } else if ('requestVideoFrameCallback' in svid) {
    const onFrame = () => {
      if (rtc !== me || me.pc !== pc) return;
      if (!me.canvas) markShown(me);
      svid.requestVideoFrameCallback(onFrame);
    };
    svid.requestVideoFrameCallback(onFrame);
  }
  me.watch = setInterval(async () => {
    if (rtc !== me || me.pc !== pc) { clearInterval(me.watch); return; }
    const stats = await inboundStats(pc).catch(() => null);
    if (!stats) return;
    if (me.shown) {
      clearInterval(me.watch);
      reportDiag(me, 'ok', stats);
      return;
    }
    if (performance.now() - started < 6000) return;
    const problem = pc.connectionState !== 'connected' || !stats.packets ? 'no-media'
      : !stats.decoded ? 'no-decode' : 'no-render';
    if (problem === me.problem) return;
    me.problem = problem;
    reportDiag(me, problem, stats);
    if (problem === 'no-render') {
      startCanvas(me);
    } else if (problem === 'no-media') {
      me.note = `Nothing is arriving from ${me.source}. The computer and this Pi may be on different networks, or a firewall is blocking the picture.`;
      me.noteIsError = true;
      streamNote(me.note, true);
    } else {
      me.note = `This Pi couldn't decode the picture from ${me.source}. Trying another format…`;
      me.noteIsError = false;
      streamNote(me.note);
    }
  }, 1500);
}

// Fallback renderer: draw each decoded frame onto a canvas ourselves.
function startCanvas(me) {
  if (me.canvas) return;
  me.canvas = true;
  document.body.classList.add('use-canvas');
  const canvas = $('#scanvas');
  const ctx = canvas.getContext('2d');
  const track = svid.srcObject && svid.srcObject.getVideoTracks()[0];
  const draw = (src, w, h) => {
    if (!w || !h) return;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    ctx.drawImage(src, 0, 0, w, h);
    markShown(me);
  };
  if (track && window.MediaStreamTrackProcessor) {
    const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    me.stopCanvas = () => reader.cancel().catch(() => {});
    (async () => {
      for (;;) {
        const { value: frame, done } = await reader.read().catch(() => ({ done: true }));
        if (done) break;
        if (rtc !== me) { frame.close(); break; }
        draw(frame, frame.displayWidth, frame.displayHeight);
        frame.close();
      }
    })();
  } else {
    const loop = () => {
      if (rtc !== me) return;
      draw(svid, svid.videoWidth, svid.videoHeight);
      me.raf = requestAnimationFrame(loop);
    };
    loop();
    me.stopCanvas = () => cancelAnimationFrame(me.raf);
  }
}

async function onOffer(sig) {
  if (!rtc || sig.session !== rtc.session) return;
  if (rtc.pc) rtc.pc.close();
  if (rtc.stopCanvas) { rtc.stopCanvas(); rtc.stopCanvas = null; }
  const keepCanvas = rtc.canvas;
  const pc = new RTCPeerConnection({ iceServers: [] });
  const me = rtc;
  me.pc = pc;
  me.shown = false;
  me.canvas = keepCanvas; // once canvas drawing was needed, keep using it for this share
  pc.ontrack = (e) => {
    pc.getReceivers().forEach((r) => { if ('jitterBufferTarget' in r) r.jitterBufferTarget = 0; });
    svid.srcObject = e.streams[0] || new MediaStream([e.track]);
    svid.play().catch(() => { svid.muted = true; svid.play().catch(() => {}); });
    if (e.track.kind === 'video') startWatchdog(me);
  };
  pc.onconnectionstatechange = () => {
    if (rtc !== me || me.pc !== pc) return;
    if (pc.connectionState === 'failed') {
      // Ask the app to try again; if the app is gone, the remote's Stop button ends the share.
      me.shown = false;
      me.note = 'The connection to the computer dropped. Reconnecting…';
      streamNote(me.note);
      me.retry = setTimeout(() => post('/api/signal', { type: 'ready', session: me.session }), 2000);
    }
  };
  await pc.setRemoteDescription({ type: 'offer', sdp: sig.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  await waitForIce(pc);
  post('/api/signal', { type: 'answer', session: me.session, sdp: pc.localDescription.sdp });
}

function renderWelcome() {
  const sc = S.screen || { name: 'PiScreen', lock: 'off' };
  document.body.classList.toggle('lowpower', !!(S.server && S.server.low_power));
  $('#screenName').textContent = sc.name;
  $('#stepName').textContent = sc.name;
  document.title = sc.name;
  const note = $('#lockNote');
  note.classList.toggle('locked', sc.lock !== 'off');
  $('#lockText').textContent = sc.lock === 'passcode' ? 'You need the passcode to share here'
    : sc.lock === 'device' ? `Only ${sc.device_name || "the admin's computer"} can share here`
    : 'Anyone on this network can share here';
}

function tickClock() {
  const now = new Date();
  // Big hours and minutes, with AM/PM (if the locale uses it) set small beside them.
  const parts = new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' }).formatToParts(now);
  const clock = $('#clock');
  clock.textContent = parts.filter((p) => p.type !== 'dayPeriod').map((p) => p.value).join('').trim();
  const period = parts.find((p) => p.type === 'dayPeriod');
  if (period) clock.insertAdjacentHTML('beforeend', `<small>${period.value}</small>`);
  $('#date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tickClock();
setInterval(tickClock, 1000);

function render() {
  const v = S.view;
  const item = S.items.find((i) => i.id === v.item);
  const rot = v.rotation % 360;
  document.body.classList.toggle('is-blank', v.blank);

  if (v.stream) {
    // A shared screen is never rotated or cropped: drop the file view's rotate/fit settings.
    document.documentElement.style.setProperty('--rot', '0deg');
    document.body.classList.remove('rot90', 'rot180', 'rot270', 'fit-width', 'fit-cover');
    handleStream(v.stream);
    return;
  }
  closeRtc();
  document.documentElement.style.setProperty('--rot', rot + 'deg');
  document.body.classList.remove('rot0', 'rot90', 'rot180', 'rot270', 'fit-contain', 'fit-width', 'fit-cover');
  document.body.classList.add('rot' + rot);
  const fit = (v.fit === 'width' && rot % 180 !== 0) ? 'contain' : v.fit;
  document.body.classList.add('fit-' + fit);

  if (!item) { wantedImg = null; renderWelcome(); setMode('idle'); loadInfo(); return; }

  if (item.kind === 'pdf') {
    if (v.page <= item.ready_pages) {
      showImage(`/media/${item.id}/page-${pad(v.page)}.jpg`);
      if (v.page + 1 <= item.ready_pages) preload(`/media/${item.id}/page-${pad(v.page + 1)}.jpg`);
      if (v.page > 1) preload(`/media/${item.id}/page-${pad(v.page - 1)}.jpg`);
    } else if (item.status === 'error') {
      message(`Could not convert "${item.name}": ${item.error || 'unknown error'}`, true);
    } else {
      wantedImg = null;
      message(item.pages > 1 || item.ready_pages > 0
        ? `Preparing page ${v.page} of ${item.pages}…`
        : `Preparing "${item.name}"…`);
    }
  } else if (item.kind === 'image') {
    showImage(`/media/${item.id}/source${item.ext}`);
  } else if (item.kind === 'video') {
    showVideo(`/media/${item.id}/source${item.ext}`, v);
  }
}

function command(c) {
  if (c.action === 'seek' && document.body.classList.contains('mode-video')) {
    vid.currentTime = Math.max(0, vid.currentTime + Number(c.delta || 0));
  } else if (c.action === 'restart') {
    vid.currentTime = 0;
  } else if (c.action === 'scroll') {
    stage.scrollBy({ top: Number(c.delta || 0.5) * window.innerHeight, behavior: 'smooth' });
  }
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (e) => {
    S = JSON.parse(e.data);
    // The server was updated and restarted: load the new version of this page.
    const c = S.server && S.server.commit;
    if (serverCommit && c && c !== serverCommit) { location.reload(); return; }
    serverCommit = c || serverCommit;
    render();
  });
  es.addEventListener('command', (e) => command(JSON.parse(e.data)));
  es.addEventListener('updating', (e) => UpdateBand.handle(JSON.parse(e.data)));
  es.addEventListener('signal', (e) => {
    const sig = JSON.parse(e.data);
    if (sig.type === 'offer') onOffer(sig).catch((err) => message('Screen share failed: ' + err.message, true));
  });
  es.onopen = () => { document.body.classList.remove('is-offline'); reportSize(); };
  es.onerror = () => document.body.classList.add('is-offline');
}
connect();

// Tell the server this screen's resolution, so the app can match it.
function reportSize() {
  const dpr = window.devicePixelRatio || 1;
  post('/api/display-info', { width: Math.round(screen.width * dpr), height: Math.round(screen.height * dpr) });
}
reportSize();
window.addEventListener('resize', reportSize);

// A keyboard or presenter clicker plugged into the Pi works too.
const send = (action, extra = {}) => fetch('/api/control', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ action, ...extra }) });
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) send('next');
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) send('prev');
  else if (k === 'Home') send('first');
  else if (k === 'End') send('last');
  else if (k === 'b' || k === '.') send('blank');
  else if (k === 'ArrowDown') send('scroll', { delta: 0.5 });
  else if (k === 'ArrowUp') send('scroll', { delta: -0.5 });
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
