<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2226">
<title>PiScreen Remote</title>
<style>
  /* Phone remote: same AV-panel language as the desktop app. Red only means live. */
  @font-face { font-family: "Archivo"; src: url("/static/fonts/archivo.woff2") format("woff2");
    font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root {
    --chassis: #e8eaec; --panel: #f6f7f8; --well: #dde0e4; --ink: #1e2226; --slate: #5e6873; --rule: #cdd2d7;
    --key: #ffffff; --key-edge: #b9c0c7; --primary: #1e2226; --primary-ink: #f6f7f8;
    --tally: #e0352b; --signal: #2e9e62; --amber: #f2a40c; --bezel: #121416;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --chassis: #16181b; --panel: #1f2226; --well: #111315; --ink: #e6e8ea; --slate: #8b949d; --rule: #2d3137;
      --key: #2a2e33; --key-edge: #0c0d0f; --primary: #e6e8ea; --primary-ink: #16181b; --bezel: #050607; color-scheme: dark; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--chassis); color: var(--ink);
    font: 400 15px/1.5 "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px 48px; }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; }
  header h1 { font-size: 22px; line-height: 1.15; margin: 0; font-weight: 800; font-stretch: 122%; letter-spacing: -0.01em; flex: 1; overflow-wrap: anywhere; }
  .conn { font-size: 12px; color: var(--slate); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .conn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--key-edge); }
  .conn.on::before { background: var(--signal); box-shadow: 0 0 0 3px rgba(46,158,98,.2); }

  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; font-weight: 650; margin: 0 0 10px; }

  button { font: inherit; font-weight: 600; font-stretch: 92%; color: var(--ink); background: var(--key);
    border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 6px;
    padding: 9px 12px 8px; cursor: pointer; min-height: 46px; touch-action: manipulation; }
  button:active { transform: translateY(2px); border-bottom-width: 1px; margin-bottom: 2px; }
  button.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); border-bottom-color: #000; }
  button.on { background: var(--amber); color: #1e1404; border-color: #b97c06; }
  button.danger { background: var(--tally); color: #fff; border-color: #a5231b; }
  button:disabled { opacity: .35; }

  /* The monitor: what's on the Pi right now */
  .monitor { position: relative; background: var(--bezel); border-radius: 10px; padding: 9px 9px 22px; }
  #preview { position: relative; aspect-ratio: 16 / 9; background: #0b0d0f; border-radius: 2px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; touch-action: pan-y; user-select: none; }
  #preview img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .2s; }
  #preview .ph { color: #8b949d; font-size: 14px; text-align: center; padding: 20px; }
  #preview .badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.72); color: #e6e8ea; font-weight: 650; }
  .tally { position: absolute; right: 11px; bottom: 6px; width: 9px; height: 9px; border-radius: 50%; background: #4a5057; }
  .tally.live { background: var(--tally); box-shadow: 0 0 0 3px rgba(224,53,43,.25), 0 0 12px rgba(224,53,43,.7); }
  #nowName { font-size: 18px; font-weight: 700; margin: 12px 0 0; overflow-wrap: anywhere; }
  #nowSub { color: var(--slate); font-size: 13px; }

  .nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 12px; align-items: stretch; }
  .nav .big { min-height: 68px; font-size: 20px; font-stretch: 88%; }
  .goto { display: flex; gap: 6px; align-items: center; }
  .goto input { width: 62px; min-height: 46px; border-radius: 6px; border: 1px solid var(--rule); background: var(--well);
    color: var(--ink); font: 600 17px/1 inherit; text-align: center; font-variant-numeric: tabular-nums; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tools button { flex: 1 1 auto; }

  #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px;
    max-height: 340px; overflow-y: auto; padding: 3px; }
  #pages button { padding: 0; min-height: 0; background: #0b0d0f; border: 0; border-radius: 4px; overflow: hidden;
    position: relative; aspect-ratio: 3 / 4; outline: 3px solid transparent; outline-offset: 1px; margin: 0; }
  #pages button:active { transform: none; }
  #pages button.cur { outline-color: var(--amber); }
  #pages img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #pages span { position: absolute; bottom: 3px; right: 3px; font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,.7); border-radius: 3px; padding: 0 5px; font-variant-numeric: tabular-nums; }

  /* Upload */
  #drop { border: 2px dashed var(--key-edge); border-radius: 8px; padding: 22px 14px; text-align: center; cursor: pointer; background: var(--chassis); }
  #drop.over { border-color: var(--amber); border-style: solid; }
  #drop strong { display: block; font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  #drop small { color: var(--slate); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row label { display: flex; align-items: center; gap: 8px; color: var(--slate); font-size: 14px; }
  .row input { accent-color: var(--ink); width: 17px; height: 17px; }
  #progress { height: 8px; background: var(--well); border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
  #progress div { height: 100%; width: 0; background: var(--amber); transition: width .15s; }
  #uploadMsg { font-size: 13px; color: var(--slate); margin-top: 6px; min-height: 1em; }

  /* Library */
  #library { list-style: none; margin: 0; padding: 0; }
  #library li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--rule); }
  #library li:first-child { border-top: 0; padding-top: 0; }
  #library .thumb { width: 58px; height: 40px; flex: none; border-radius: 3px; background: #0b0d0f; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: #8b949d; font-size: 11px; font-weight: 700; font-stretch: 80%; }
  #library .thumb img { width: 100%; height: 100%; object-fit: cover; }
  #library .meta { flex: 1; min-width: 0; }
  #library .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #library .sub { font-size: 12px; color: var(--slate); }
  #library .sub.err { color: var(--tally); }
  #library li.cur .thumb { outline: 3px solid var(--amber); outline-offset: 1px; }
  #library button { min-height: 40px; padding: 5px 12px 4px; }
  #library button.danger { background: var(--key); color: var(--tally); border-color: var(--key-edge); }
  .empty { color: var(--slate); font-size: 14px; padding: 6px 0; }
  .hidden { display: none !important; }
  .pill { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--rule); white-space: nowrap; }

  /* Lock screen */
  #lockScreen { position: fixed; inset: 0; z-index: 50; background: var(--chassis); display: flex; align-items: center;
    justify-content: center; padding: 24px 16px; }
  .lock-card { width: min(360px, 100%); text-align: center; }
  .lock-icon { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 1.7; margin-bottom: 8px; }
  .lock-card h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; font-stretch: 115%; line-height: 1.15; }
  .lock-card p { margin: 0 0 18px; color: var(--slate); }
  #passInput { width: 100%; min-height: 56px; font: 700 24px/1 inherit; letter-spacing: .35em; text-align: center;
    border-radius: 6px; border: 1px solid var(--rule); background: var(--well); color: var(--ink); }
  #lockErr { color: var(--tally); font-size: 13px; min-height: 20px; margin: 8px 0; }
  .lock-card button { width: 100%; min-height: 50px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="screenTitle">PiScreen</h1>
    <span id="lockPill" class="pill hidden">Locked</span>
    <span class="conn" id="conn" role="status">Connecting…</span>
  </header>

  <div id="lockScreen" class="hidden">
    <form class="lock-card" id="lockForm">
      <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <h2 id="lockTitle">PiScreen is locked</h2>
      <p id="lockText">Enter the passcode to control this screen.</p>
      <div id="passArea">
        <input id="passInput" type="password" inputmode="numeric" autocomplete="off" aria-label="Passcode">
        <div id="lockErr" role="alert"></div>
        <button class="primary" type="submit">Unlock</button>
      </div>
    </form>
  </div>

  <section class="card" aria-label="On screen now">
    <div class="monitor">
      <div id="preview"><div class="ph">Nothing is showing.<br>Upload a file or pick one from the library.</div></div>
      <span id="tally" class="tally"></span>
    </div>
    <div id="nowName"></div>
    <div id="nowSub"></div>

    <div id="pdfNav" class="nav hidden">
      <button class="big" data-act="prev" aria-label="Previous page">Back</button>
      <div class="goto">
        <input id="pageInput" type="number" inputmode="numeric" min="1" aria-label="Page number">
        <button id="gotoBtn">Go</button>
      </div>
      <button class="big primary" data-act="next" aria-label="Next page">Next</button>
    </div>

    <div id="videoNav" class="tools hidden">
      <button data-act="seek" data-delta="-10">Back 10 s</button>
      <button id="playBtn" class="primary" data-act="play">Pause</button>
      <button data-act="seek" data-delta="10">Forward 10 s</button>
      <button data-act="restart">Restart</button>
      <button id="muteBtn" data-act="mute">Mute</button>
      <button id="loopBtn" data-act="loop">Loop</button>
    </div>

    <div id="viewTools" class="tools hidden">
      <button id="fitBtn" data-act="fit">Fit: whole</button>
      <button data-act="rotate">Rotate</button>
      <button id="scrollUp" data-act="scroll" data-delta="-0.5" class="hidden">Scroll up</button>
      <button id="scrollDown" data-act="scroll" data-delta="0.5" class="hidden">Scroll down</button>
      <button id="blankBtn" data-act="blank">Blank screen</button>
      <button class="danger" data-act="stop">Stop</button>
    </div>
  </section>

  <section id="pagesCard" class="card hidden">
    <h2>Pages</h2>
    <div id="pages"></div>
  </section>

  <section class="card">
    <h2>Upload</h2>
    <div id="drop" role="button" tabindex="0">
      <strong>Choose files</strong>
      <small>or drop them here. PDFs, images, videos, slides and documents.</small>
    </div>
    <input id="fileInput" type="file" multiple class="hidden"
      accept=".pdf,image/*,video/*,.ppt,.pptx,.pps,.ppsx,.odp,.doc,.docx,.odt,.rtf,.xls,.xlsx,.ods">
    <div class="row"><label><input type="checkbox" id="showNow" checked> Show on screen right away</label></div>
    <div id="progress"><div></div></div>
    <div id="uploadMsg" role="status"></div>
  </section>

  <section class="card">
    <h2>Library</h2>
    <ul id="library"></ul>
  </section>
</main>

<script src="/static/update-band.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(4, '0');
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FIT_LABEL = { contain: 'Fit: whole', width: 'Fit: width', cover: 'Fit: fill' };
let S = { items: [], view: {} };
let pagesKey = '', libKey = '';

async function api(action, extra = {}) {
  const r = await fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...extra }) });
  if (r.status === 401) { start(); return; }
  if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.error || 'Request failed'); }
}

const thumbOf = (item, n = 1) => item.kind === 'pdf'
  ? (item.ready_pages >= n ? `/media/${item.id}/thumb-${pad(n)}.jpg` : null)
  : item.kind === 'image' ? `/media/${item.id}/source${item.ext}` : null;

function fmtSize(n) {
  if (!n) return '';
  return n >= 1024 ** 3 ? `, ${(n / 1024 ** 3).toFixed(1)} GB` : `, ${Math.max(1, Math.round(n / 1024 ** 2))} MB`;
}

function statusText(item) {
  if (item.status === 'error') return 'Error: ' + (item.error || 'conversion failed');
  if (item.kind === 'pdf') {
    if (item.status === 'processing') return item.ready_pages ? `Preparing… ${item.ready_pages}/${item.pages} pages` : 'Preparing…';
    return `${item.pages} page${item.pages === 1 ? '' : 's'}${fmtSize(item.size)}`;
  }
  return (item.kind === 'video' ? 'Video' : 'Image') + fmtSize(item.size);
}

function renderStream(v) {
  const prev = $('#preview');
  prev.innerHTML = '<div class="ph">Live from a computer</div>';
  $('#tally').classList.toggle('live', !v.blank);
  $('#nowName').textContent = v.stream.source;
  $('#nowSub').textContent = 'A computer is sharing its screen with the PiScreen app.';
  ['#pdfNav', '#videoNav', '#pagesCard', '#scrollUp', '#scrollDown', '#fitBtn', '[data-act=rotate]']
    .forEach((s) => $(s).classList.add('hidden'));
  $('#viewTools').classList.remove('hidden');
  $('#viewTools [data-act=stop]').textContent = 'Stop sharing';
  $('#blankBtn').classList.toggle('on', v.blank);
}

function render() {
  const v = S.view, item = S.items.find((i) => i.id === v.item);
  const isPdf = item && item.kind === 'pdf', isVideo = item && item.kind === 'video';
  $('#viewTools [data-act=stop]').textContent = 'Stop';
  $('#fitBtn').classList.remove('hidden');
  $('[data-act=rotate]').classList.remove('hidden');
  if (v.stream) { renderStream(v); renderLibrary(v); return; }

  // Preview
  const prev = $('#preview');
  let src = null;
  if (isPdf && v.page <= item.ready_pages) src = `/media/${item.id}/page-${pad(v.page)}.jpg`;
  else if (item && item.kind === 'image') src = `/media/${item.id}/source${item.ext}`;
  const badge = v.blank ? '<span class="badge">Blanked</span>' : '';
  $('#tally').classList.toggle('live', !!item && !v.blank);
  if (!item) prev.innerHTML = '<div class="ph">Nothing is showing.<br>Upload a file or pick one from the library.</div>';
  else if (src) {
    const img = prev.querySelector('img');
    if (!img || img.getAttribute('src') !== src) prev.innerHTML = `<img src="${src}" alt="">`;
  } else prev.innerHTML = `<div class="ph">${isVideo ? (v.playing ? 'Playing a video' : 'Video paused') : 'Preparing page ' + v.page + '…'}</div>`;
  prev.querySelector('.badge')?.remove();
  if (badge) prev.insertAdjacentHTML('beforeend', badge);
  const pimg = prev.querySelector('img');
  if (pimg) pimg.style.transform = `rotate(${v.rotation}deg)`;

  $('#nowName').textContent = item ? item.name : '';
  $('#nowSub').textContent = !item ? '' : isPdf
    ? `Page ${v.page} of ${item.pages}` + (item.status === 'processing' ? `, ${item.ready_pages} ready so far` : '')
    : statusText(item);

  $('#pdfNav').classList.toggle('hidden', !isPdf);
  $('#videoNav').classList.toggle('hidden', !isVideo);
  $('#viewTools').classList.toggle('hidden', !item);
  if (isPdf) {
    const input = $('#pageInput');
    input.max = item.pages;
    if (document.activeElement !== input) input.value = v.page;
    $('#pdfNav [data-act=prev]').disabled = v.page <= 1;
    $('#pdfNav [data-act=next]').disabled = v.page >= item.pages;
  }
  $('#playBtn').textContent = v.playing ? 'Pause' : 'Play';
  $('#muteBtn').classList.toggle('on', v.muted);
  $('#muteBtn').textContent = v.muted ? 'Muted' : 'Mute';
  $('#loopBtn').classList.toggle('on', v.loop);
  $('#fitBtn').textContent = FIT_LABEL[v.fit] || 'Fit';
  $('#blankBtn').classList.toggle('on', v.blank);
  const canScroll = item && item.kind !== 'video' && v.fit === 'width' && v.rotation % 180 === 0;
  $('#scrollUp').classList.toggle('hidden', !canScroll);
  $('#scrollDown').classList.toggle('hidden', !canScroll);

  // Page thumbnails
  $('#pagesCard').classList.toggle('hidden', !(isPdf && item.pages > 1));
  if (isPdf) {
    const key = item.id + ':' + item.ready_pages + ':' + item.pages;
    if (key !== pagesKey) {
      pagesKey = key;
      let html = '';
      for (let n = 1; n <= item.pages; n++) {
        const t = n <= item.ready_pages ? `<img loading="lazy" src="/media/${item.id}/thumb-${pad(n)}.jpg" alt="">` : '';
        html += `<button data-page="${n}">${t}<span>${n}</span></button>`;
      }
      $('#pages').innerHTML = html;
    }
    $('#pages').querySelectorAll('button').forEach((b) => {
      const cur = Number(b.dataset.page) === v.page;
      if (cur && !b.classList.contains('cur')) b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      b.classList.toggle('cur', cur);
    });
  } else pagesKey = '';
  renderLibrary(v);
}

function renderLibrary(v) {
  const lkey = JSON.stringify([S.items, v.item]);
  if (lkey !== libKey) {
    libKey = lkey;
    $('#library').innerHTML = S.items.length ? S.items.map((it) => {
      const t = thumbOf(it);
      const label = (it.ext || '').slice(1).toUpperCase();
      return `<li class="${it.id === v.item ? 'cur' : ''}">
        <div class="thumb">${t ? `<img loading="lazy" src="${t}" alt="">` : label}</div>
        <div class="meta"><div class="name">${esc(it.name)}</div>
          <div class="sub ${it.status === 'error' ? 'err' : ''}">${esc(statusText(it))}</div></div>
        <button class="primary" data-show="${it.id}">Show</button>
        <button class="danger" data-del="${it.id}" aria-label="Delete">✕</button>
      </li>`;
    }).join('') : '<li class="empty">No files yet.</li>';
  }
}

// Buttons
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act) {
    const extra = b.dataset.delta ? { delta: Number(b.dataset.delta) } : {};
    api(b.dataset.act, extra);
  } else if (b.dataset.page) api('goto', { page: Number(b.dataset.page) });
  else if (b.dataset.show) api('show', { item: b.dataset.show });
  else if (b.dataset.del) {
    const it = S.items.find((i) => i.id === b.dataset.del);
    if (it && confirm(`Delete "${it.name}"?`)) fetch('/api/items/' + it.id, { method: 'DELETE' });
  }
});
$('#gotoBtn').onclick = () => api('goto', { page: Number($('#pageInput').value) });
$('#pageInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { $('#gotoBtn').click(); e.target.blur(); } });

// Swipe on the preview to change pages
let touchX = null;
$('#preview').addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$('#preview').addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) api(dx < 0 ? 'next' : 'prev');
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') api('next');
  else if (e.key === 'ArrowLeft') api('prev');
});

// Upload
const drop = $('#drop'), fileInput = $('#fileInput');
drop.onclick = () => fileInput.click();
drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); };
fileInput.onchange = () => { if (fileInput.files.length) upload(fileInput.files); fileInput.value = ''; };
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });

function upload(files) {
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  fd.append('show', $('#showNow').checked ? '1' : '0');
  const bar = $('#progress'), msg = $('#uploadMsg');
  bar.style.display = 'block'; bar.firstElementChild.style.width = '0';
  msg.textContent = `Uploading ${files.length} file${files.length === 1 ? '' : 's'}…`;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      bar.firstElementChild.style.width = pct + '%';
      msg.textContent = `Uploading… ${pct}%`;
    }
  };
  xhr.onload = () => {
    bar.style.display = 'none';
    let res = {}; try { res = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status >= 400) { msg.textContent = res.error || `Upload failed (${xhr.status})`; return; }
    const parts = [];
    if (res.created?.length) parts.push(`Uploaded ${res.created.length} file${res.created.length === 1 ? '' : 's'}.`);
    if (res.rejected?.length) parts.push(`Unsupported: ${res.rejected.join(', ')}`);
    msg.textContent = parts.join(' ');
  };
  xhr.onerror = () => { bar.style.display = 'none'; msg.textContent = 'Upload failed — is the Pi reachable?'; };
  xhr.send(fd);
}

// Access / lock screen
let events = null;
async function checkAccess() {
  let a;
  try { a = await (await fetch('/api/auth')).json(); } catch { return false; }
  $('#screenTitle').textContent = a.name;
  document.title = a.name + ' Remote';
  $('#lockPill').classList.toggle('hidden', a.lock === 'off');
  $('#lockPill').textContent = a.lock === 'passcode' ? 'Passcode lock' : 'One computer only';
  if (a.access) { $('#lockScreen').classList.add('hidden'); return true; }
  if (events) { events.close(); events = null; }
  $('#lockTitle').textContent = `${a.name} is locked`;
  const pass = a.lock === 'passcode';
  $('#lockText').textContent = pass ? 'Enter the passcode to control this screen.'
    : `Only ${a.device_name || "the admin's computer"} can control this screen right now.`;
  $('#passArea').classList.toggle('hidden', !pass);
  $('#lockScreen').classList.remove('hidden');
  if (pass) setTimeout(() => $('#passInput').focus(), 50);
  return false;
}

$('#lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/auth/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passcode: $('#passInput').value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('#lockErr').textContent = d.error || 'Could not unlock'; $('#passInput').select(); return; }
  $('#passInput').value = ''; $('#lockErr').textContent = '';
  start();
});

async function start() {
  if (await checkAccess()) connect();
}

// Live updates
function connect() {
  if (events) events.close();
  const es = events = new EventSource('/api/events');
  es.addEventListener('auth', () => { es.close(); start(); });
  es.addEventListener('updating', (e) => UpdateBand.handle(JSON.parse(e.data)));
  let commit = null;
  es.addEventListener('state', (e) => {
    S = JSON.parse(e.data);
    const c = S.server && S.server.commit;
    if (commit && c && c !== commit) { location.reload(); return; } // server was updated
    commit = c || commit;
    render();
  });
  es.onopen = () => { $('#conn').classList.add('on'); $('#conn').textContent = 'Connected'; };
  es.onerror = () => {
    $('#conn').classList.remove('on'); $('#conn').textContent = 'Reconnecting…';
    if (es.readyState === EventSource.CLOSED) setTimeout(start, 2000); // e.g. locked (401): show the lock screen
  };
}
start();
</script>
