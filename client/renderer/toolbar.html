<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>PiScreen toolbar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1 system-ui, "Segoe UI", sans-serif; user-select: none; }
  .bar { position: absolute; inset: 4px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px;
    background: #10233f; color: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12); }
  .grip { -webkit-app-region: drag; width: 22px; height: 100%; display: flex; align-items: center; justify-content: center;
    color: #7f93b3; font-size: 16px; letter-spacing: -2px; cursor: move; }
  .live { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; -webkit-app-region: drag; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5a4f; box-shadow: 0 0 0 3px rgba(255,90,79,.25); flex: none; }
  .paused .dot { background: #f4b740; box-shadow: 0 0 0 3px rgba(244,183,64,.25); }
  #label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  button { -webkit-app-region: no-drag; font: inherit; color: #fff; background: rgba(255,255,255,.1); border: 0;
    border-radius: 9px; height: 38px; padding: 0 11px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  button:hover { background: rgba(255,255,255,.18); }
  button.on { background: #2f6fed; }
  #stop { background: #ff7a2f; color: #1d0e03; font-weight: 700; }
  #stop:hover { background: #ff8f4f; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="grip" title="Drag to move">⋮⋮</div>
    <div class="live"><span class="dot"></span><span id="label">Sharing</span></div>
    <button id="pause" title="Freeze the picture on the Pi">❚❚ Pause</button>
    <button id="blank" title="Black out the Pi screen">◐ Blank</button>
    <button id="stop">■ Stop</button>
    <button id="open" title="Open the PiScreen app">⤢</button>
  </div>
<script>
  const P = window.piscreen;
  const $ = (s) => document.querySelector(s);
  ['pause', 'blank', 'stop', 'open'].forEach((a) => $('#' + a).addEventListener('click', () => P.toolbarAction(a)));
  P.onToolbarState((s) => {
    $('#bar').classList.toggle('paused', !!s.paused);
    $('#label').textContent = (s.paused ? 'Paused · ' : 'Sharing · ') + (s.source || '');
    $('#pause').textContent = s.paused ? '▶ Resume' : '❚❚ Pause';
    $('#blank').classList.toggle('on', !!s.blank);
  });
</script>
</body>
</html>
