<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>PiScreen toolbar</title>
<style>
  @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 600 13px/1 "Archivo", system-ui, sans-serif; font-stretch: 92%; }
  .bar { position: absolute; inset: 4px; display: flex; align-items: center; gap: 6px; padding: 0 7px 0 4px;
    background: #1e2226; color: #e6e8ea; border-radius: 8px; border: 1px solid #000;
    border-top: 3px solid #e0352b; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .paused { border-top-color: #f2a40c; }
  .grip { -webkit-app-region: drag; width: 18px; align-self: stretch; cursor: move;
    background: radial-gradient(circle, #59616a 1.2px, transparent 1.6px) center / 6px 6px; margin: 10px 2px; }
  .live { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; -webkit-app-region: drag; }
  .tally { width: 10px; height: 10px; border-radius: 50%; background: #e0352b; flex: none;
    box-shadow: 0 0 0 3px rgba(224,53,43,.25), 0 0 12px rgba(224,53,43,.7); }
  .paused .tally { background: #f2a40c; box-shadow: 0 0 12px rgba(242,164,12,.6); }
  #label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 650; font-stretch: 100%; }
  button { -webkit-app-region: no-drag; font: inherit; color: #e6e8ea; background: #33383e; cursor: pointer;
    border: 1px solid #0c0d0f; border-bottom-width: 3px; border-radius: 5px; height: 36px; padding: 0 11px; }
  button:active { transform: translateY(2px); border-bottom-width: 1px; }
  button:focus-visible { outline: 2px solid #f2a40c; outline-offset: 1px; }
  button.on { background: #f2a40c; color: #1e1404; border-color: #b97c06; }
  #stop { background: #e0352b; color: #fff; border-color: #a5231b; }
  #open svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -3px; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="grip" title="Drag to move"></div>
    <div class="live"><span class="tally"></span><span id="label">Sharing</span></div>
    <button id="pause" title="Hold the current picture on the Pi">Pause</button>
    <button id="blank" title="Black out the Pi's screen">Blank</button>
    <button id="stop">Stop</button>
    <button id="open" title="Open PiScreen" aria-label="Open PiScreen">
      <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg></button>
  </div>
<script>
  const P = window.piscreen;
  const $ = (s) => document.querySelector(s);
  ['pause', 'blank', 'stop', 'open'].forEach((a) => $('#' + a).addEventListener('click', () => P.toolbarAction(a)));
  P.onToolbarState((s) => {
    $('#bar').classList.toggle('paused', !!s.paused);
    $('#label').textContent = (s.paused ? 'Paused: ' : 'Live: ') + (s.source || '');
    $('#pause').textContent = s.paused ? 'Resume' : 'Pause';
    $('#blank').classList.toggle('on', !!s.blank);
  });
</script>
</body>
</html>
